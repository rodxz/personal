<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>Treine Melhor, Alcance Seus Objetivos – Personal Trainer - Cadastro</title>
            <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link href="estilo.css" rel="stylesheet">
    </head>
    <body id="cadastro">

        <div class="container">
    <h2>Agendamento com Personal Trainer</h2>
    <form>
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="whatsapp">Número do WhatsApp:</label>
      <input type="tel" id="whatsapp" name="whatsapp" placeholder="(XX) XXXXX-XXXX" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label>Escolha os serviços:</label>
      <div class="cards">
        <div class="card">
          <span>Treino funcional</span>
          <input type="checkbox" name="servico" value="funcional">
        </div>
        <div class="card">
          <span>Musculação personalizada</span>
          <input type="checkbox" name="servico" value="musculacao">
        </div>
        <div class="card">
          <span>Consultoria nutricional</span>
          <input type="checkbox" name="servico" value="nutricional">
        </div>
      </div>

            <label for="observacao">Observações:</label>
            <textarea id="observacao" name="observacao" rows="4" placeholder="Escreva aqui qualquer detalhe adicional..."></textarea>

        <button type="submit">Enviar Agendamento</button>
        </form>
    </div>

    </body>
</html>
