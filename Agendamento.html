<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>Treine Melhor, Alcance Seus Objetivos – Personal Trainer - Cadastro</title>
        <style>
            body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .card {
      background-color: #e6e6e6;
      padding: 15px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card input {
      width: auto;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }

        </style>
            <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link href="estilo.css" rel="stylesheet">
    </head>
    <body id="cadastro">

        <div class="container">
    <h2>Agendamento com Personal Trainer</h2>
    <form>
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="whatsapp">Número do WhatsApp:</label>
      <input type="tel" id="whatsapp" name="whatsapp" placeholder="(XX) XXXXX-XXXX" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label>Escolha os serviços:</label>
      <div class="cards">
        <div class="card">
          <span>Treino funcional</span>
          <input type="checkbox" name="servico" value="funcional">
        </div>
        <div class="card">
          <span>Musculação personalizada</span>
          <input type="checkbox" name="servico" value="musculacao">
        </div>
        <div class="card">
          <span>Consultoria nutricional</span>
          <input type="checkbox" name="servico" value="nutricional">
        </div>
      </div>

            <label for="observacao">Observações:</label>
            <textarea id="observacao" name="observacao" rows="4" placeholder="Escreva aqui qualquer detalhe adicional..."></textarea>

        <button type="submit">Enviar Agendamento</button>
        </form>
    </div>

    </body>
</html>
